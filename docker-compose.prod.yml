services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads
    env_file:
      - .env
    environment:
      PORT: 3000
      FRONTEND_URL: http://localhost
      JWT_SECRET: dev-secret
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - backend
